name: fetch-app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL 'https://paste.rs/xb1lA' -o index.html
          test "$(wc -c < index.html)" -eq 175357
          git config user.name 'alon-tab'
          git config user.email 'alon-tab@users.noreply.github.com'
          git add index.html
          git commit -m 'Add calorie counter app'
          git push
