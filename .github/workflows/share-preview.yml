name: Add share preview
on:
  push:
    paths:
      - '.github/workflows/share-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: share-preview
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add image and metadata only
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text()
          assert 'property="og:image"' not in s, 'Metadata already present, inspect before updating'
          meta = '<meta name="description" content="סופרת הקלוריות">\n<meta property="og:type" content="website">\n<meta property="og:locale" content="he_IL">\n<meta property="og:site_name" content="סופרת הקלוריות">\n<meta property="og:title" content="סופרת הקלוריות">\n<meta property="og:description" content="סופרת הקלוריות">\n<meta property="og:url" content="https://alon-tab.github.io/calorie-counter/">\n<meta property="og:image" content="https://alon-tab.github.io/calorie-counter/og-image.jpg">\n<meta property="og:image:secure_url" content="https://alon-tab.github.io/calorie-counter/og-image.jpg">\n<meta property="og:image:type" content="image/jpeg">\n<meta property="og:image:width" content="1200">\n<meta property="og:image:height" content="630">\n<meta property="og:image:alt" content="סופרת הקלוריות, משקל מזון עם תפוח וסרט מידה">\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="סופרת הקלוריות">\n<meta name="twitter:description" content="סופרת הקלוריות">\n<meta name="twitter:image" content="https://alon-tab.github.io/calorie-counter/og-image.jpg">\n<meta name="twitter:image:alt" content="סופרת הקלוריות, משקל מזון עם תפוח וסרט מידה">\n'
          s = s.replace('</title>', '</title>\n' + meta, 1)
          p.write_text(s)
          Path('og-image.jpg').write_bytes(base64.b64decode(''))
          PYCODE
          git config user.name 'alon-tab'
          git config user.email 'alon-tab@users.noreply.github.com'
          git add index.html og-image.jpg
          git commit -m 'Add calorie counter link preview image and metadata'
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
