<style>
:root{
  --bg:#f4f7f5; --card:#ffffff; --ink:#1c2b26; --muted:#6b7d76;
  --brand:#0e9f6e; --brand-d:#0b7d57; --brand-soft:#e3f5ee;
  --danger:#d64545; --danger-soft:#fbeaea;
  --line:#e4ece8; --shadow:0 2px 10px rgba(20,50,40,.08);
  --radius:16px;
}
*{box-sizing:border-box; margin:0; padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
}
.shell{width:100%; max-width:600px; padding:0 14px 110px; display:flex; flex-direction:column; gap:14px}

/* ===== header ===== */
header.app{
  position:sticky; top:0; z-index:30;
  background:linear-gradient(135deg,#0e9f6e,#0b7d57 60%,#0a6b4c);
  color:#fff; padding:16px 0 14px; box-shadow:0 3px 14px rgba(10,90,60,.25);
  width:100%; display:flex; flex-direction:column; align-items:center;
}
header.app .inner{width:100%; max-width:600px; padding:0 14px}
h1{font-size:1.35rem; font-weight:800; letter-spacing:.2px; display:flex; align-items:center; gap:8px}
h1 .sub{font-size:.72rem; font-weight:400; opacity:.85; margin-inline-start:2px}
.daynav{display:flex; align-items:center; gap:8px; margin-top:12px}
.daynav button{
  background:rgba(255,255,255,.16); border:none; color:#fff; border-radius:12px;
  width:40px; height:40px; font-size:1.15rem; cursor:pointer; flex:none;
  display:flex; align-items:center; justify-content:center; transition:background .15s;
}
.daynav button:hover{background:rgba(255,255,255,.3)}
.daynav button:active{transform:scale(.94)}
.daylabel{flex:1; text-align:center}
.daylabel .d1{font-weight:700; font-size:1.02rem}
.daylabel .d2{font-size:.75rem; opacity:.85}
.daylabel input{position:absolute; opacity:0; pointer-events:none}
.btn-today{
  background:rgba(255,255,255,.16); border:none; color:#fff; border-radius:12px;
  height:40px; padding:0 12px; font-family:inherit; font-size:.82rem; cursor:pointer; flex:none;
}
.btn-today:hover{background:rgba(255,255,255,.3)}

/* ===== summary ===== */
.summary{
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:16px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.summary .kcal-big{line-height:1.05}
.summary .kcal-big b{font-size:2.1rem; font-weight:800; color:var(--brand-d)}
.summary .kcal-big span{display:block; font-size:.78rem; color:var(--muted)}
.macros{display:flex; gap:8px; flex-wrap:wrap; margin-inline-start:auto}
.chip{
  background:var(--brand-soft); border-radius:12px; padding:7px 11px; text-align:center; min-width:64px;
}
.chip b{display:block; font-size:.95rem}
.chip span{font-size:.68rem; color:var(--muted)}
.summary .day-ops{margin-inline-start:auto}
.icon-btn{
  border:none; background:transparent; cursor:pointer; border-radius:10px;
  font-size:1.05rem; width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center;
  transition:background .15s;
}
.icon-btn:hover{background:#eef4f1}

/* ===== meals ===== */
.meal{
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;
}
.meal-head{
  display:flex; align-items:center; gap:8px; padding:12px 16px;
  border-bottom:1px solid var(--line); background:#fbfdfc;
}
.meal-head h2{font-size:1.02rem; font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.meal-head .mtotal{font-weight:800; color:var(--brand-d); font-size:.95rem; white-space:nowrap}
.items{list-style:none}
.item{
  display:flex; align-items:center; gap:10px; padding:11px 16px;
  border-bottom:1px solid var(--line);
}
.item:last-child{border-bottom:none}
.item .info{flex:1; min-width:0}
.item .nm{font-weight:600; font-size:.92rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item .qt{font-size:.76rem; color:var(--muted)}
.item .kc{font-weight:700; font-size:.92rem; white-space:nowrap}
.item .kc small{font-weight:400; color:var(--muted); font-size:.7rem}
.meal-foot{padding:10px 16px 14px}
.btn{
  font-family:inherit; cursor:pointer; border:none; border-radius:12px;
  padding:10px 16px; font-size:.9rem; font-weight:600; transition:filter .15s, transform .05s;
}
.btn:active{transform:scale(.97)}
.btn-brand{background:var(--brand); color:#fff}
.btn-brand:hover{background:var(--brand-d)}
.btn-ghost{background:#eef4f1; color:var(--ink)}
.btn-ghost:hover{background:#e1ebe6}
.btn-danger{background:var(--danger); color:#fff}
.btn-danger:hover{filter:brightness(.92)}
.btn-block{width:100%}
.add-meal{
  position:sticky; top:calc(var(--head-h,118px) + 8px); z-index:20;
  align-self:center; width:auto; min-width:min(320px, 92%);
  border:none; background:linear-gradient(135deg,#0e9f6e,#0b7d57); color:#fff;
  border-radius:999px; padding:12px 26px; font-family:inherit; font-size:.98rem; font-weight:700; cursor:pointer;
  box-shadow:0 6px 18px rgba(10,90,60,.35);
}
.add-meal:hover{background:linear-gradient(135deg,#0b8f63,#0a6b4c)}
.add-meal:active{transform:scale(.97)}

/* ===== goal: percent of daily reference ===== */
.goal{display:flex; flex-direction:column; gap:6px; margin-top:12px}
.goal-row{display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:.82rem; color:var(--muted)}
.goal-row b{color:var(--ink); font-size:1.05rem}
.goal-track{position:relative; height:10px; border-radius:99px; background:var(--brand-soft); overflow:hidden}
.goal-fill{position:absolute; inset-inline-start:0; top:0; bottom:0; border-radius:99px; background:linear-gradient(90deg,#3ec493,var(--brand)); transition:width .3s ease}
.goal-cta{align-self:flex-start; border:1.5px dashed #b9d4c9; background:transparent; color:var(--brand-d); border-radius:999px; padding:7px 14px; font-family:inherit; font-size:.8rem; font-weight:600; cursor:pointer}
.goal-cta:hover{background:#eef7f3}

/* ===== macro split bar ===== */
.macro-split{flex-basis:100%; display:flex; flex-direction:column; gap:5px; margin-top:10px}
.macro-split-track{display:flex; height:9px; border-radius:99px; overflow:hidden; background:var(--brand-soft)}
.macro-split-track i{display:block; height:100%}
.macro-split-track .ms-p{background:#3e8ec4}
.macro-split-track .ms-c{background:#e8a13c}
.macro-split-track .ms-f{background:#9a72c9}
.macro-split-key{display:flex; gap:12px; flex-wrap:wrap; font-size:.68rem; color:var(--muted)}
.macro-split-key span{display:flex; align-items:center; gap:4px}

async function loadDB(){
  const bin = Uint8Array.from(atob(DB_B64), c=>c.charCodeAt(0));
  const stream = new Response(bin).body.pipeThrough(new DecompressionStream('gzip'));
  const DB = JSON.parse(await new Response(stream).text());
  UNITS = DB.units;
  FOODS = DB.foods.map((f,i)=>({id:'m'+i, n:f.n, k:f.e, p:f.p, f:f.f, c:f.c,
    u:(f.u||[]).map(([li,g])=>({l:UNITS[li], g:g}))}));
  EXTRA_FOODS.forEach((f,i)=>FOODS.push({id:'x'+i, n:f.n, k:f.k, p:f.p, f:f.f, c:f.c, u:(f.u||[]).map(([l,g])=>({l,g}))}));
}

/* ===== מצב ואחסון ===== */
const LS_KEY = 'calorie-counter.v1';
let S = loadState();
let curDay = todayStr();

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return {v:1, days:{}, custom:[], saved:[]};
    const s = JSON.parse(raw);
    if(!s || typeof s!=='object' || !s.days) return {v:1, days:{}, custom:[], saved:[]};
    s.custom = s.custom || [];
    s.saved = s.saved || [];
    s.profile = (s.profile && typeof s.profile==='object') ? s.profile : null;
    s.weights = Array.isArray(s.weights) ? s.weights.filter(e=>e && /^\d{4}-\d{2}-\d{2}$/.test(e.d||'') && e.kg>0) : [];
    s.goal = (s.goal>0) ? s.goal : null;
    return s;
  }catch(e){ return {v:1, days:{}, custom:[], saved:[]}; }
}
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function shiftDay(iso, n){
  const d = new Date(iso+'T12:00:00');
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(iso){
  return new Date(iso+'T12:00:00').toLocaleDateString('he-IL',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function r1(x){ const v=Math.round(x*10)/10; return Number.isInteger(v)? String(v) : v.toFixed(1); }

/* ===== חישובים ===== */
function itemGrams(it){ return it.mode==='u' ? it.amt*it.ug : it.amt; }
function itemKcal(it){ return it.k * itemGrams(it) / 100; }
function itemMacro(it, key){ return it[key] * itemGrams(it) / 100; }
function itemQtyText(it){
  const g = itemGrams(it);
  return it.mode==='u' ? `${r1(it.amt)} × ${it.unit} (${r1(g)} גרם)`
    : it.mode==='ml' ? `${r1(it.amt)} מ״ל (≈${r1(g)} גרם)` : `${r1(it.amt)} גרם`;
}
function cloneItems(items){
  return items.map(it=>{
    const c = Object.assign({}, it);
    c.uOpts = it.uOpts ? it.uOpts.map(u=>Object.assign({}, u)) : undefined;
    delete c.id;
    return c;
  });
}
function savedKcal(s){ return s.items.reduce((a,it)=>a+itemKcal(it),0); }
function getDay(){ return S.days[curDay] || (S.days[curDay] = {meals:[]}); }
function dayTotals(){
  const d = S.days[curDay];
  const t = {k:0, p:0, c:0, f:0};
  if(!d) return t;
  for(const meal of d.meals) for(const it of meal.items){
    t.k += itemKcal(it); t.p += itemMacro(it,'p'); t.c += itemMacro(it,'c'); t.f += itemMacro(it,'f');
  }
  return t;
}

/* ===== פרופיל: BMI והערכת צריכה יומית ===== */
const ACT_LEVELS = [
  {f:1.2,   l:'יושבנית — רוב היום ללא תנועה'},
  {f:1.375, l:'קלה — הליכה או תנועה מדי פעם'},
  {f:1.55,  l:'בינונית — פעילות 3-5 פעמים בשבוע'},
  {f:1.725, l:'גבוהה — פעילות 6-7 פעמים בשבוע'},
  {f:1.9,   l:'גבוהה מאוד — עבודה פיזית או ספורט תחרותי'}
];
function profileCalc(p){
  if(!p || !(p.w>0) || !(p.h>0) || !(p.age>0)) return null;
  const bmr = 10*p.w + 6.25*p.h - 5*p.age + (p.sex==='f' ? -161 : 5);
  const act = ACT_LEVELS[+p.act||0] || ACT_LEVELS[0];
  const tdee = bmr * act.f;
  const hm = p.h/100;
  const bmi = p.w/(hm*hm);
  return {bmr, tdee, bmi, act};
}
function bmiLabel(b){
  if(b<18.5) return 'מתחת לטווח המקובל';
  if(b<25) return 'בטווח המקובל';
  if(b<30) return 'מעל הטווח המקובל';
  return 'בטווח הגבוה';
}
function dayGoal(){
  if(S.goal>0) return {kcal:S.goal, manual:true};
  const c = profileCalc(S.profile);
  return c ? {kcal:c.tdee, manual:false} : null;
}

/* ===== חיפוש ===== */
function allFoods(){
  const customs = S.custom.map((c,i)=>({id:'c'+i, n:c.n, k:c.k, p:c.p||0, f:c.f||0, c:c.c||0,
    u: c.ug ? [{l:'יחידה', g:c.ug}] : [], custom:true}));
  return customs.concat(FOODS);
}
const SEARCH_ALIASES = [
  [/^חלווה/, 'חלבה'],
  [/^חלב (סויה|שקדים|שיבולת שועל|שיבלות שועל|אורז|קוקוס|אגוזי לוז|קשיו)/, 'משקה $1'],
  [/^(גרגירי|גרגרי) חומוס/, 'חומוס גרגירים'],
  [/^(יובא|יוּבה|יובה)$/, 'יובה'],
  [/^נתחי סויה|^סויה מיובשת|^סויה גרוסה/, 'חלבון צמחי מעובד יבש'],
  [/^טי ?וי ?פי$|^tvp$/i, 'חלבון צמחי מעובד יבש'],
  [/^סיטן|^סייטאן|^סיטאן|^seitan/i, 'סייטן'],
  [/^טמפה|^טמפֶה|^tempeh/i, 'טמפה'],
  [/^בורקס/, 'בורקס'],
];
function normSearch(t){
  return String(t).replace(/[\u0591-\u05C7]/g,'').replace(/[׳’‘`´]/g,"'").replace(/[״”“]/g,'"').replace(/\s+/g,' ').trim().toLowerCase();
}
function looseKey(t){ return t.replace(/[יו'"]/g,''); }
function searchFoods(q){
  q = normSearch(q);
  if(q.length < 1) return [];
  const queries = [q];
  for(const [re, rep] of SEARCH_ALIASES){ if(re.test(q)){ const a = normSearch(q.replace(re, rep)); if(!queries.includes(a)) queries.push(a); } }
  const foods = allFoods();
  const scored = new Map(); const loose = [];
  const consider = (f, score)=>{ const prev = scored.get(f); if(prev===undefined || score<prev) scored.set(f, score); };
  for(const f of foods){
    const name = normSearch(f.n);
    const lname = looseKey(name);
    for(const [qi, qq] of queries.entries()){
      const i = name.indexOf(qq);
      if(i >= 0){
        consider(f, (i===0 ? 0 : (name[i-1]===' '||name[i-1]===','||name[i-1]==='-' ? 1 : 2)) + (f.custom? -0.5 : 0) + (qi? 0.2:0));
        continue;
      }
      const toks = qq.split(' ').filter(Boolean);
      if(toks.length>1 && toks.every(t=>name.includes(t))) { consider(f, 3 + (f.custom?-0.5:0)); continue; }
      const ltoks = toks.map(looseKey).filter(Boolean);
      if(ltoks.length && ltoks.every(t=>lname.includes(t)) && ltoks.join('').length>=3) loose.push(f);
    }
  }
  if(!scored.size) loose.forEach(f=>consider(f, 4 + (f.custom?-0.5:0)));
  return [...scored.entries()].sort((a,b)=> a[1]-b[1] || a[0].n.length-b[0].n.length).slice(0,12).map(x=>x[0]);
}

/* ===== הקבועים שלך — המוצרים שנרשמים הכי הרבה ===== */
function frequentItems(limit){
  const map = new Map();
  for(const iso of Object.keys(S.days)){
    for(const meal of (S.days[iso].meals||[])) for(const it of (meal.items||[])){
      const key = [it.name, it.mode, it.unit||'', it.ug||'', it.amt].join('|');
      const e = map.get(key);
      if(e){ e.count++; if(iso > e.last) e.last = iso; }
      else map.set(key, {count:1, last:iso, it});
    }
  }
  return [...map.values()]
    .sort((a,b)=> b.count-a.count || (a.last<b.last?1:-1))
    .slice(0, limit||8);
}

      const o = opts[selIdx];
      const data = {
        foodId:picked.id, name:picked.n, k:picked.k, p:picked.p||0, f:picked.f||0, c:picked.c||0,
        amt:a, mode:o.mode,
        unit: o.mode==='u'? o.label : undefined, ug: o.mode==='u'? o.grams : undefined,
        uOpts: picked.u||[]
      };
      if(existing){
        Object.assign(existing, data);
        toast('המצרך עודכן ✓');
      }else{
        data.id = uid();
        meal.items.push(data);
        toast('נוסף ✓');
      }
      saveState(); closeModal(); render();
    };
  }
  if(existing) showPicked();
}

/* ===== חלוקת מקרו: אחוז הקלוריות מכל רכיב ===== */
function renderMacroSplit(t){
  const el = $('#macroSplit');
  if(!el) return;
  const pc = t.p*4, cc = t.c*4, fc = t.f*9, tot = pc+cc+fc;
  if(tot<=0){ el.innerHTML=''; return; }
  const pp = pc/tot*100, cp = cc/tot*100, fp = fc/tot*100;
  el.innerHTML = `<div class="macro-split-track" role="img" aria-label="חלוקת הקלוריות: חלבון ${Math.round(pp)} אחוז, פחמימות ${Math.round(cp)} אחוז, שומן ${Math.round(fp)} אחוז"><i class="ms-p" style="width:${pp.toFixed(1)}%"></i><i class="ms-c" style="width:${cp.toFixed(1)}%"></i><i class="ms-f" style="width:${fp.toFixed(1)}%"></i></div>
  <div class="macro-split-key"><span><i style="background:#3e8ec4"></i>חלבון ${Math.round(pp)}%</span><span><i style="background:#e8a13c"></i>פחמימות ${Math.round(cp)}%</span><span><i style="background:#9a72c9"></i>שומן ${Math.round(fp)}%</span></div>`;
}

/* ===== מים: מונה כוסות יומי ===== */
function waterCount(){ const d = S.days[curDay]; return (d && d.water>0) ? d.water : 0; }
function setWater(n){
  const d = getDay();
  d.water = Math.max(0, Math.min(20, n));
  saveState(); renderWater();
}
function renderWater(){
  const el = $('#waterArea');
  if(!el) return;
  const n = waterCount();
  let drops = '';
  for(let i=0;i<8;i++){
    const on = i<n;
    drops += `<svg viewBox="0 0 12 15" aria-hidden="true"><path d="M6 1.2C6 1.2 1.6 6.5 1.6 9.6a4.4 4.4 0 0 0 8.8 0C10.4 6.5 6 1.2 6 1.2Z" fill="${on?'#4aa8e0':'none'}" stroke="${on?'#4aa8e0':'#b9cdc5'}" stroke-width="1.3" stroke-linejoin="round"/></svg>`;
  }
  el.innerHTML = `<span class="w-label">מים</span>
  <button id="wMinus" aria-label="הורדת כוס מים">−</button>
  <span class="w-drops" role="img" aria-label="${n} כוסות מים היום">${drops}</span>
  <span class="w-count">${n}</span>
  <button id="wPlus" aria-label="הוספת כוס מים">+</button>`;
  $('#wMinus').onclick = ()=>setWater(n-1);
  $('#wPlus').onclick = ()=>setWater(n+1);
}

/* ===== מעקב משקל עם גרף מגמה ===== */
function weightEntries(){ return (S.weights||[]).slice().sort((a,b)=> a.d<b.d?-1:1); }
function trackModal(){
  openModal(`
    <div class="modal-head"><h3>מעקב משקל</h3><button class="icon-btn" data-x>✖️</button></div>
    <div class="row">
      <div class="field"><label>תאריך</label><input type="date" id="wDate" value="${curDay}"></div>
      <div class="field"><label>משקל (ק״ג)</label><input type="number" id="wKg" min="20" max="400" step="any" inputmode="decimal" placeholder="למשל 70.5"></div>
    </div>
    <button class="btn btn-brand btn-block" id="wAdd">שמירת רשומה</button>
    <div id="wGraphArea"></div>
    <div id="wListArea"></div>
    <p class="hint">הרשומות נשמרות במכשיר בלבד. הגרף נותן תמונת מצב אישית בלבד — מספרים לא מספרים את כל הסיפור, וליווי של דיאטנית או רופא תמיד עדיף על נתון בודד.</p>
    <div class="modal-actions"><button class="btn btn-brand btn-block" data-x>סגירה</button></div>`);
  modalRoot.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeModal);
  function draw(){
    const es = weightEntries();
    const gA = $('#wGraphArea'), lA = $('#wListArea');
    if(es.length===0){
      gA.innerHTML = `<div class="report-empty"><b>עוד אין רשומות משקל</b><span>אחרי שמירה ראשונה יופיע כאן גרף מגמה.</span></div>`;
      lA.innerHTML = '';
      return;
    }
    const w=300, h=110, pad=14;
    const kgs = es.map(e=>e.kg);
    let mn = Math.min.apply(null,kgs), mx = Math.max.apply(null,kgs);
    if(mx-mn < 1){ mn -= 0.5; mx += 0.5; }
    const xs = i => es.length===1 ? w/2 : pad + i*(w-2*pad)/(es.length-1);
    const ys = kg => h-pad - (kg-mn)/(mx-mn)*(h-2*pad);
    const pts = es.map((e,i)=>[xs(i), ys(e.kg)]);
    const line = pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const dots = pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="#0e9f6e"><title>${fmtDate(es[i].d)}: ${r1(es[i].kg)} ק״ג</title></circle>`).join('');
    const last = es[es.length-1], first = es[0];
    const diff = last.kg - first.kg;
    const diffTxt = (diff>0?'+':'')+r1(diff);
    gA.innerHTML = `<div class="wgraph">
      <svg viewBox="0 0 ${w} ${h}" role="img" aria-label="גרף מגמת משקל">
        <polyline points="${line}" fill="none" stroke="#0e9f6e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}
        <text x="${pad}" y="${(ys(mx)+11).toFixed(1)}" font-size="9" fill="#6b7d76">${r1(mx)}</text>
        <text x="${pad}" y="${(ys(mn)-6).toFixed(1)}" font-size="9" fill="#6b7d76">${r1(mn)}</text>
      </svg>
      <div class="report-caption">${fmtDate(first.d)} — ${fmtDate(last.d)}</div>
    </div>
    <div class="wstats">
      <div class="wstat"><b>${r1(last.kg)}</b><span>ק״ג · רשומה אחרונה</span></div>
      <div class="wstat"><b>${diffTxt}</b><span>ק״ג · שינוי מהרשומה הראשונה</span></div>
      <div class="wstat"><b>${es.length}</b><span>רשומות</span></div>
    </div>`;
    lA.innerHTML = `<div class="wlist">${es.slice().reverse().slice(0,30).map(e=>`<div class="wrow"><span class="w-date">${fmtDate(e.d)}</span><span class="w-kg">${r1(e.kg)} ק״ג</span><button class="icon-btn w-del" data-d="${e.d}" title="מחיקת רשומה" aria-label="מחיקת רשומה">🗑️</button></div>`).join('')}</div>`;
    lA.querySelectorAll('.w-del').forEach(b=>b.onclick=()=>{
      S.weights = weightEntries().filter(e=>e.d!==b.dataset.d);
      saveState(); draw(); toast('הרשומה נמחקה');
    });
  }
  $('#wAdd').onclick = ()=>{
    const d = $('#wDate').value, kg = parseFloat($('#wKg').value);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ toast('צריך לבחור תאריך'); return; }
    if(!(kg>0)){ toast('צריך להזין משקל'); return; }
    S.weights = weightEntries().filter(e=>e.d!==d).concat([{d:d, kg:kg}]);
    saveState(); $('#wKg').value=''; draw(); toast('המשקל נשמר ✓');
  };
  draw();
}

function doBackup(){
  const payload = {app:'calorie-counter', v:1, exportedAt:new Date().toISOString(), days:S.days, custom:S.custom, saved:S.saved, profile:S.profile, weights:S.weights||[], goal:(S.goal>0?S.goal:null)};
  const blob = new Blob([JSON.stringify(payload,null,1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'calories-backup-'+todayStr()+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  toast('קובץ הגיבוי ירד למכשיר ✓');
}
function doRestoreFile(file){
  const rd = new FileReader();
  rd.onload = ()=>{
    let data;
    try{ data = JSON.parse(rd.result); }
    catch(e){ toast('הקובץ לא תקין — לא שוחזר'); return; }
    if(!data || typeof data!=='object' || typeof data.days!=='object' || data.days===null){
      toast('הקובץ לא נראה כמו גיבוי של האפליקציה'); return;
    }
    showConfirm({
      title:'שחזור מגיבוי',
      text:'הקובץ תקין. לשחזר את הנתונים?',
      warn:'פעולה זו תחליף ותמחק את כל הנתונים הקיימים כרגע באפליקציה. אם יש נתונים חשובים — כדאי להוריד גיבוי שלהם קודם.',
      okLabel:'כן, שחזרי',
      onOk:()=>{
        S = {v:1, days:data.days, custom:Array.isArray(data.custom)?data.custom:[], saved:Array.isArray(data.saved)?data.saved:[], profile:(data.profile && typeof data.profile==='object')?data.profile:null, weights:Array.isArray(data.weights)?data.weights.filter(e=>e && e.d && e.kg>0):[], goal:(data.goal>0?data.goal:null)};
        saveState(); render(); toast('הנתונים שוחזרו ✓');
      }
    });
  };
  rd.readAsText(file);
}

/* Calendar reports are read-only projections of the existing v1 diary. */
let reportMode = 'week', reportAnchor = curDay;
const reportNumber = n => Math.round(n).toLocaleString('he-IL');
function totalsForDate(iso){
  const t = {k:0,p:0,c:0,f:0,items:0};
  for(const meal of (S.days[iso]?.meals || [])) for(const it of meal.items){
    t.k += itemKcal(it); t.p += itemMacro(it,'p'); t.c += itemMacro(it,'c'); t.f += itemMacro(it,'f'); t.items++;
  }
  return t;
}
function reportDates(anchor, mode){
  const d = new Date(anchor+'T12:00:00');
  const start = mode==='week' ? shiftDay(anchor,-d.getDay()) : anchor.slice(0,7)+'-01';
  const length = mode==='week' ? 7 : new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  return Array.from({length},(_,i)=>shiftDay(start,i));
}
function shiftReport(anchor, mode, delta){
  if(mode==='week') return shiftDay(anchor,delta*7);
  const d = new Date(anchor+'T12:00:00');
  d.setDate(1); d.setMonth(d.getMonth()+delta);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
}
function reportModal(){
  reportAnchor=curDay;
  drawReport();
}
function drawReport(){
  const dates=reportDates(reportAnchor,reportMode), today=todayStr();
  const rows=dates.map(date=>({date,...totalsForDate(date)}));
  const logged=rows.filter(r=>r.items>0);
  const sum=logged.reduce((a,r)=>{for(const k of ['k','p','c','f'])a[k]+=r[k];return a;},{k:0,p:0,c:0,f:0});
  const first=dates[0], last=dates[dates.length-1];
  const shortDate=iso=>new Date(iso+'T12:00:00').toLocaleDateString('he-IL',{day:'numeric',month:'short'});
  const title=reportMode==='week' ? `${shortDate(first)} עד ${shortDate(last)} · ${new Date(last+'T12:00:00').getFullYear()}` : new Date(first+'T12:00:00').toLocaleDateString('he-IL',{month:'long',year:'numeric'});
  const max=Math.max(1,...rows.map(r=>r.k));
  const days=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
  const cellLabel=r=>`${fmtDate(r.date)}: ${r.items ? reportNumber(r.k)+' קק״ל, פתיחת היומן' : 'ללא רישום, פתיחת היומן'}`;
  const weekly=`<div class="week-chart" aria-label="קלוריות לפי יום">${rows.map((r,i)=>`<button class="week-day ${r.date===today?'is-today':''}" data-report-date="${r.date}" aria-label="${cellLabel(r)}"><span class="bar-value">${r.items?reportNumber(r.k):'–'}</span><span class="bar-track"><span class="bar-fill ${r.items?'':'no-log'}" style="height:${r.items?Math.max(3,r.k/max*100):3}%"></span></span><b>${days[i]}</b><small>${new Date(r.date+'T12:00:00').getDate()}</small></button>`).join('')}</div>`;
  const offset=new Date(first+'T12:00:00').getDay();
  const monthly=`<div class="month-grid">${days.map(d=>`<span class="weekday">${d}</span>`).join('')}${'<span aria-hidden="true"></span>'.repeat(offset)}${rows.map(r=>`<button class="month-day ${r.items?'has-log':''} ${r.date===today?'is-today':''} ${r.date>today?'future-day':''}" data-report-date="${r.date}" aria-label="${cellLabel(r)}"><b>${Number(r.date.slice(-2))}</b><span>${r.items?reportNumber(r.k):'–'}</span></button>`).join('')}</div><p class="report-caption">המספר בכל יום הוא סך הקלוריות · קק״ל</p>`;
  openModal(`<div class="modal-head"><div><div class="report-eyebrow">היומן שלך, במבט רחב</div><h3 id="reportTitle">סיכום ומגמות</h3></div><button class="icon-btn" data-report-close aria-label="סגירת הסיכום">✕</button></div>
    <div class="report-tabs" role="tablist" aria-label="טווח הסיכום"><button role="tab" aria-selected="${reportMode==='week'}" data-mode="week">שבועי</button><button role="tab" aria-selected="${reportMode==='month'}" data-mode="month">חודשי</button></div>
    <div class="report-navigation"><button data-period="-1" aria-label="${reportMode==='week'?'שבוע קודם':'חודש קודם'}">→</button><h4 aria-live="polite">${title}</h4><button data-period="1" aria-label="${reportMode==='week'?'שבוע הבא':'חודש הבא'}">←</button></div>
    <div class="report-jump"><label>מעבר לתאריך <input type="date" id="reportDate" value="${reportAnchor}"></label><button class="btn btn-ghost" id="reportToday">${reportMode==='week'?'השבוע':'החודש'}</button></div>
    <div class="report-stats"><div class="report-stat main-stat"><b>${logged.length?reportNumber(sum.k/logged.length):'–'}</b><span>ממוצע קק״ל ליום עם רישום</span></div><div class="report-stat"><b>${logged.length}</b><span>ימים עם רישום מתוך ${dates.length}</span></div></div>
    <section class="report-plot" aria-label="${reportMode==='week'?'גרף שבועי':'לוח חודשי'}">${reportMode==='week'?weekly:monthly}</section>
    <div class="report-key"><span><i></i> יום עם רישום</span><span>– ללא רישום</span><span class="today-key">מסגרת: היום</span></div>
    ${logged.length?`<div class="report-total">סך הכול בתקופה <b>${reportNumber(sum.k)} <small>קק״ל</small></b></div><div class="report-macros"><span><b>${r1(sum.p/logged.length)}</b> חלבון</span><span><b>${r1(sum.c/logged.length)}</b> פחמימות</span><span><b>${r1(sum.f/logged.length)}</b> שומן</span></div><p class="report-caption">ממוצע גרמים ליום עם רישום</p>`:'<div class="report-empty"><b>עוד אין רישומים בתקופה הזו</b><span>לחצי על יום כדי לפתוח את היומן ולהוסיף ארוחה.</span></div>'}
    <p class="report-note">הממוצעים כוללים רק ימים עם מצרכים, גם אם הרישום חלקי. יום ללא רישום אינו נחשב לאפס קלוריות.${logged.some(r=>r.date===today)?' היום כלול וייתכן שטרם הושלם.':''}</p><p class="report-caption">לחצי על יום כדי לראות או לערוך את הארוחות שלו.</p>`);
  const dialog=modalRoot.querySelector('.modal');
  dialog.classList.add('report-modal'); dialog.setAttribute('aria-labelledby','reportTitle');
  document.body.style.overflow='hidden';
  modalRoot.querySelector('[data-report-close]').onclick=closeModal;
  modalRoot.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{reportMode=b.dataset.mode;drawReport();modalRoot.querySelector(`[data-mode="${reportMode}"]`).focus();});
  modalRoot.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{const delta=+b.dataset.period;reportAnchor=shiftReport(reportAnchor,reportMode,delta);drawReport();modalRoot.querySelector(`[data-period="${delta}"]`).focus();});
  $('#reportToday').onclick=()=>{reportAnchor=todayStr();drawReport();$('#reportToday').focus();};
  $('#reportDate').onchange=e=>{if(/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){reportAnchor=e.target.value;drawReport();$('#reportDate').focus();}};
  modalRoot.querySelectorAll('[data-report-date]').forEach(b=>b.onclick=()=>{curDay=b.dataset.reportDate;closeModal();render();$('#calendarBtn').focus();});
  modalRoot.querySelector('[data-report-close]').focus();
}
document.addEventListener('keydown',e=>{
  const report=modalRoot.querySelector('.report-modal'); if(!report)return;
  if(e.key==='Escape'){e.preventDefault();closeModal();$('#calendarBtn').focus();}
  if(e.key==='Tab'){
    const items=[...report.querySelectorAll('button,input')], first=items[0],last=items[items.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});
$('#calendarBtn').onclick=reportModal;

$('#nextDay').onclick = ()=>{ curDay = shiftDay(curDay, 1); render(); };
$('#todayBtn').onclick = ()=>{ curDay = todayStr(); render(); };

$('#addMeal').onclick = mealModal;
$('#clearDay').onclick = ()=>{
  const d = S.days[curDay];
  if(!d || d.meals.length===0){ toast('היום כבר ריק'); return; }
  showConfirm({
    title:'מחיקת היום',
    text:`למחוק את כל הארוחות והמצרכים של ${fmtDate(curDay)}?`,
    warn:'כל הרשומות של היום יימחקו לצמיתות.',

    onOk:()=>{ delete S.days[curDay]; saveState(); render(); toast('היום נמחק'); }
  });
};

$('#navRestore').onclick = ()=> $('#restoreFile').click();
$('#restoreFile').addEventListener('change', e=>{
  if(e.target.files[0]) doRestoreFile(e.target.files[0]);
  e.target.value='';
});
$('#navCustom').onclick = customModal;
$('#navSettings').onclick = settingsModal;
$('#navTrack').onclick = trackModal;
$('#navInfo').onclick = infoModal;

mealsEl.addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const day = getDay();
  if(btn.classList.contains('item-add')){
    itemModal(btn.dataset.id, null);
  }else if(btn.classList.contains('act-edit')){
    const meal = day.meals.find(m=>m.items.some(it=>it.id===btn.dataset.id));
    const it = meal && meal.items.find(x=>x.id===btn.dataset.id);
    if(it) itemModal(meal.id, it);
  }else if(btn.classList.contains('act-del')){
    const meal = day.meals.find(m=>m.items.some(it=>it.id===btn.dataset.id));
    const it = meal && meal.items.find(x=>x.id===btn.dataset.id);
    if(!it) return;
    showConfirm({
      title:'מחיקת מצרך',
      text:`למחוק את "${it.name}" (${Math.round(itemKcal(it))} קק״ל)?`,
      okLabel:'מחיקה',
      onOk:()=>{
        meal.items = meal.items.filter(x=>x.id!==it.id);
        saveState(); render(); toast('המצרך נמחק');
      }
    });
  }else if(btn.classList.contains('meal-save')){
    const meal = day.meals.find(m=>m.id===btn.dataset.id);
    if(meal) saveMealModal(meal);
  }else if(btn.classList.contains('meal-edit')){
    const meal = day.meals.find(m=>m.id===btn.dataset.id);
    if(!meal) return;
    openModal(`
      <div class="modal-head"><h3>שינוי שם</h3><button class="icon-btn" data-x>✖️</button></div>
      <div class="field"><label>שם חדש</label><input type="text" id="rn" value="${esc(meal.name)}"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-x style="flex:1">ביטול</button>
        <button class="btn btn-brand" id="ok" style="flex:2">שמירה</button>
      </div>`);
    modalRoot.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeModal);
    $('#ok').onclick = ()=>{
      const n = $('#rn').value.trim();
      if(n){ meal.name=n; saveState(); }
      closeModal(); render();
    };
  }else if(btn.classList.contains('meal-del')){
    const meal = day.meals.find(m=>m.id===btn.dataset.id);
    if(!meal) return;
    showConfirm({
      title:'מחיקת ארוחה',
      text:`למחוק את "${meal.name}" וכל ${meal.items.length} המצרכים שבה?`,
      warn:'הארוחה וכל המצרכים שבה יימחקו לצמיתות.',
      okLabel:'מחיקה',
      onOk:()=>{
        day.meals = day.meals.filter(m=>m.id!==meal.id);
        saveState(); render(); toast('הארוחה נמחקה');
      }
    });
  }
});

});
